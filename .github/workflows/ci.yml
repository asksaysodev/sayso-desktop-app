name: CI

# Runs on every PR. `Validate` is a required check in the repo ruleset.
# Typecheck + unit tests only: no native modules, no packaging (that's release-windows.yml / fresh-export).
on:
  pull_request:
    branches: [development, staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24, not the 20 the release uses: `npm test` imports .ts files and needs Node's type stripping.
          node-version: 24
          cache: npm

      # --ignore-scripts: skips the Electron binary download and native rebuilds, which tsc and the tests don't need.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck (main + preload)
        run: npx tsc -p tsconfig.electron.json --noEmit

      - name: Typecheck (renderer)
        run: npx tsc -p tsconfig.json --noEmit

      - name: Run tests
        run: npm test
